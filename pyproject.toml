[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sounding"
version = "0.9.4"
description = "Governance for agent instructions: audit, score, and pin MCP servers, Agent Skills, and prompts. Deterministic; findings carry a reference and a fix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alinotfound" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alinotfoundbtw/sounding"
Issues = "https://github.com/alinotfoundbtw/sounding/issues"

[project.scripts]
sounding = "sounding.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sounding"]
